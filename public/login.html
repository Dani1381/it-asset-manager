<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - IT Asset Master</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
    }
    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
    }
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .login-brand h1 {
      font-size: 1.35rem;
      color: var(--text-main);
    }
    .login-brand .icon {
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-brand">
      <span class="icon">📦</span>
      <h1>IT Asset Master</h1>
    </div>
    <p style="color: var(--text-muted); font-size: 0.88rem; text-align: center; margin-bottom: 1.5rem;">
      Enter the access password to manage inventory and photos.
    </p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" autofocus required>
      </div>

      <div id="error-msg" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display: none; text-align: center;"></div>

      <button type="submit" class="btn btn-primary" id="btn" style="width: 100%;">
        Unlock
      </button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      const btn = document.getElementById('btn');
      err.style.display = 'none';
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        if (data.success) {
          const next = new URLSearchParams(window.location.search).get('next') || '/';
          window.location.href = next;
        } else {
          err.textContent = data.error || 'Incorrect password';
          err.style.display = 'block';
          btn.textContent = 'Unlock';
        }
      } catch (ex) {
        err.textContent = 'Connection error: ' + ex.message;
        err.style.display = 'block';
        btn.textContent = 'Unlock';
      }
    }
  </script>
</body>
</html>
