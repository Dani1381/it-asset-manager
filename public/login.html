<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود - IT Asset Master</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #0b1329);
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 2.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
    }
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .login-brand h1 {
      font-size: 1.45rem;
      color: var(--text-main);
      font-weight: 800;
    }
    .login-brand .icon {
      font-size: 2.2rem;
    }
  </style>
</head>
<body class="rtl">
  <div class="login-box">
    <div class="login-brand">
      <span class="icon">📦</span>
      <h1>مدیریت دارایی‌های IT</h1>
    </div>
    <p style="color: var(--text-muted); font-size: 0.95rem; text-align: center; margin-bottom: 1.75rem;">
      برای دسترسی به پنل اموال و ثبت دوربین، رمز عبور را وارد کنید.
    </p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="password">رمز عبور (Password)</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" autofocus required style="text-align: center; font-size: 1.2rem;">
      </div>

      <div id="error-msg" style="color: var(--danger); font-size: 0.9rem; margin-bottom: 1rem; display: none; text-align: center;"></div>

      <button type="submit" class="btn btn-primary" id="btn" style="width: 100%; font-size: 1.05rem; padding: 0.8rem;">
        ورود به سیستم
      </button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const err = document.getElementById('error-msg');
      const btn = document.getElementById('btn');
      err.style.display = 'none';
      btn.textContent = 'در حال بررسی...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        if (data.success) {
          const next = new URLSearchParams(window.location.search).get('next') || '/';
          window.location.href = next;
        } else {
          err.textContent = 'رمز عبور نادرست است!';
          err.style.display = 'block';
          btn.textContent = 'ورود به سیستم';
        }
      } catch (ex) {
        err.textContent = 'خطا در برقراری ارتباط: ' + ex.message;
        err.style.display = 'block';
        btn.textContent = 'ورود به سیستم';
      }
    }
  </script>
</body>
</html>
