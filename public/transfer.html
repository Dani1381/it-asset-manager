<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انتقال قطعه - IT Asset Master</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/session.js"></script>
  <script src="/i18n.js"></script>
  <script src="/categories.js"></script>
</head>
<body class="rtl">
  <header class="navbar">
    <a href="/" class="nav-brand">
      <div class="nav-brand-icon">📦</div>
      <span data-i18n="app_name">سیستم مدیریت دارایی‌های IT</span>
    </a>
    <div class="nav-links">
      <a href="/" class="btn btn-secondary btn-sm">← <span data-i18n="nav_back">بازگشت به لیست</span></a>
    </div>
  </header>

  <main class="container finder-page">
    <h2>🔁 دستیار انتقال قطعه</h2>
    <p class="bulk-help">کاری که کردید را معمولی بنویسید؛ دستیار می‌فهمد چه قطعه‌ای از کجا به کجا رفته، قبل از ثبت به شما نشان می‌دهد، و بعد از تأیید روی هر دو دستگاه و در تاریخچه قطعات ثبت می‌کند.</p>

    <section class="report-card">
      <div id="ctx-box" class="transfer-ctx" hidden></div>
      <textarea id="t-text" class="form-control" rows="3" placeholder="مثلاً: ۲ گیگ رم از 1058 برداشتم انداختم تو 1102، هاردش هم انداختم تو 1200"></textarea>
      <div class="transfer-examples">
        نمونه‌ها:
        <button type="button" class="chip-btn" onclick="example(this)">۲ گیگ رم از 1058 به 1102</button>
        <button type="button" class="chip-btn" onclick="example(this)">هارد 1056 رفت انبار قطعات</button>
        <button type="button" class="chip-btn" onclick="example(this)">NT-0029 را انداختم روی 1102</button>
      </div>
      <div class="wizard-nav-btns" style="margin-top: 0.8rem;">
        <button type="button" class="btn btn-secondary" onclick="addManual()">➕ ردیف دستی</button>
        <button type="button" class="btn btn-primary" id="parse-btn" onclick="parse()">🤖 بفهم چه کردم</button>
      </div>
    </section>

    <div id="moves"></div>
    <div id="actions" class="wizard-nav-btns" style="margin-top: 1rem;" hidden>
      <button type="button" class="btn btn-secondary" onclick="clearAll()">پاک کردن</button>
      <button type="button" class="btn btn-success" id="apply-btn" onclick="applyAll()">✅ درست است، ثبت کن</button>
    </div>
    <div id="result"></div>
  </main>

  <datalist id="ids"></datalist>

  <script>
    try { if (!JSON.parse(localStorage.getItem('arka_user') || 'null')) location.href = '/login.html'; } catch (e) { location.href = '/login.html'; }
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
    const qs = new URLSearchParams(location.search);
    const context = (qs.get('from') || qs.get('context') || '').trim();
    const COMP = { ram: '🧠 رم', storage: '💿 هارد', cpu: '⚙️ پردازنده', gpu: '🎮 گرافیک' };
    let moves = [];

    function example(btn) { document.getElementById('t-text').value = btn.textContent; }

    async function api(url, body) {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok && !data.moves) throw new Error(data.error || 'خطا');
      return data;
    }

    async function parse() {
      const text = document.getElementById('t-text').value.trim();
      if (!text) return;
      const btn = document.getElementById('parse-btn');
      btn.disabled = true; btn.textContent = '⏳ دارم می‌فهمم...';
      try {
        const data = await api('/api/parts/parse', { text, context });
        moves = data.moves.map(fromPreview);
        if (!moves.length) alert('چیزی نفهمیدم؛ قطعه (رم/هارد) و شماره اموال‌ها را بنویسید یا ردیف دستی اضافه کنید.');
        render();
      } catch (e) { alert('❌ ' + e.message); }
      btn.disabled = false; btn.textContent = '🤖 بفهم چه کردم';
    }

    const endVal = (kind, a) => a ? a.property_id : (kind === 'new' ? 'new' : 'spare');
    function fromPreview(p) {
      return { component: p.component, from: endVal(p.fromKind, p.from), to: endVal(p.toKind, p.to), gb: p.gb, part: p.part || '', note: '', preview: p };
    }

    function addManual() {
      moves.push({ component: 'storage', from: context, to: '', gb: null, part: '', note: '', preview: null });
      render();
      refresh(moves.length - 1);
    }
    function clearAll() { moves = []; render(); document.getElementById('result').innerHTML = ''; }

    function endLabel(kind, a) {
      if (a) return `<strong>${esc(a.property_id)}</strong> <small>${esc(a.model)}</small>`;
      return kind === 'new' ? '🆕 قطعه نو' : '📦 انبار قطعات';
    }

    function render() {
      document.getElementById('moves').innerHTML = moves.map((m, i) => {
        const p = m.preview || {};
        const opts = (p.options || []).length > 1
          ? `<select class="filter-select" onchange="setField(${i}, 'part', this.value)">${['<option value="">کدام هارد؟</option>', ...p.options.map(o => `<option${o === m.part ? ' selected' : ''}>${esc(o)}</option>`)].join('')}</select>` : '';
        return `<div class="report-card transfer-row${p.error ? ' has-error' : p.part ? ' is-ok' : ''}">
          <div class="transfer-line">
            <span class="transfer-num">${i + 1}</span>
            <select class="filter-select" onchange="setField(${i}, 'component', this.value)">${Object.entries(COMP).map(([k, v]) => `<option value="${k}"${k === m.component ? ' selected' : ''}>${v}</option>`).join('')}</select>
            <label>از <input class="form-control t-id" list="ids" value="${esc(m.from)}" placeholder="شماره / انبار" onchange="setField(${i}, 'from', this.value)"></label>
            <label>به <input class="form-control t-id" list="ids" value="${esc(m.to)}" placeholder="شماره / انبار" onchange="setField(${i}, 'to', this.value)"></label>
            ${m.component === 'ram' ? `<label>گیگ <input type="number" class="form-control t-gb" min="0.5" step="0.5" value="${esc(m.gb || '')}" onchange="setField(${i}, 'gb', this.value)"></label>` : ''}
            ${opts}
            <button type="button" class="btn btn-secondary btn-sm" onclick="moves.splice(${i}, 1); render();">🗑️</button>
          </div>
          <div class="transfer-preview">
            ${p.error ? `⚠️ ${esc(p.error)}` : p.part
              ? `${COMP[m.component]} <strong dir="ltr">${esc(p.part)}</strong>: ${endLabel(p.fromKind, p.from)} ⬅️ از · به ➡️ ${endLabel(p.toKind, p.to)}${p.standalone ? ' <span class="transfer-tag">قطعه جدا — کارتش «نصب‌شده روی مقصد» می‌شود</span>' : ''}`
              : '…'}
          </div>
          <input class="form-control" placeholder="توضیح (اختیاری)" value="${esc(m.note)}" onchange="moves[${i}].note = this.value">
        </div>`;
      }).join('');
      document.getElementById('actions').hidden = !moves.length;
    }

    function setField(i, k, v) {
      moves[i][k] = k === 'gb' ? (Number(v) || null) : v;
      refresh(i);
    }
    async function refresh(i) {
      const m = moves[i];
      try {
        const data = await api('/api/parts/transfer', { dry_run: true, moves: [m] });
        m.preview = data.moves[0];
        if (m.preview.part && !m.part) m.part = m.preview.part;
        if (m.preview.gb && !m.gb) m.gb = m.preview.gb;
      } catch (e) { m.preview = { error: e.message }; }
      render();
    }

    async function applyAll() {
      if (moves.some(m => !m.preview || m.preview.error)) { alert('اول ردیف‌های قرمز را درست کنید.'); return; }
      const btn = document.getElementById('apply-btn');
      btn.disabled = true;
      try {
        const data = await api('/api/parts/transfer', { moves: moves.map(({ preview, ...m }) => m) });
        if (!data.success) throw new Error(data.error || 'خطا');
        document.getElementById('result').innerHTML = `<div class="report-card transfer-done">✅ ثبت شد:<ul>${data.moves.map(p =>
          `<li>${COMP[p.component]} <span dir="ltr">${esc(p.part)}</span>: ${p.from ? `<a href="/asset.html?id=${p.from.id}">${esc(p.from.property_id)}</a>` : endLabel(p.fromKind)} → ${p.to ? `<a href="/asset.html?id=${p.to.id}">${esc(p.to.property_id)}</a>` : '📦 انبار قطعات'}</li>`).join('')}</ul></div>`;
        moves = []; render();
        document.getElementById('t-text').value = '';
      } catch (e) { alert('❌ ' + e.message); }
      btn.disabled = false;
    }

    (async () => {
      try {
        const assets = await (await fetch('/api/assets?limit=100000')).json();
        document.getElementById('ids').innerHTML = '<option value="spare">📦 انبار قطعات</option>' + assets
          .filter(a => ['PC', 'Single PC', 'All-in-One', 'Laptop', 'Server', 'Storage'].includes(a.category))
          .map(a => `<option value="${esc(a.property_id)}">${esc(a.manufacturer_model || '')}${a.user_name ? ' — ' + esc(a.user_name) : ''}</option>`).join('');
        if (context) {
          const a = assets.find(x => String(x.property_id) === context);
          const box = document.getElementById('ctx-box');
          box.hidden = false;
          box.innerHTML = `📍 دستگاه فعلی: <strong>${esc(context)}</strong> ${esc(a ? a.manufacturer_model || '' : '')} — «اینجا» یعنی این دستگاه.`;
          if (a && a.category === 'Storage') {
            document.getElementById('t-text').value = `${context} را انداختم روی `;
            document.getElementById('t-text').focus();
          }
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
